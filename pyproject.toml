[project]
name = "lab-crawler"
version = "0.1.0"
description = "會計論壇 QA 爬蟲"
readme = "README.md"
authors = [
    { name = "hung", email = "11146062@ntub.edu.tw" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
